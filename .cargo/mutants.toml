# cargo-mutants configuration.
# Advisory mutation testing: surfaces test gaps, never gates CI.
#
# exclude_globs drops crates where mutation testing carries no signal:
#   - vendored/local grammar crates (generated parser tables, not our logic)
#   - benchmark and profiling crates (perf harnesses, no correctness assertions)
exclude_globs = [
    "benchmarks/**",
    "crates/bearwisdom-bench/**",
    "crates/bearwisdom-profile/**",
    "crates/tree-sitter-dockerfile-0-25/**",
    "crates/tree-sitter-scss-local/**",
]
